name: Build FARX Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential ccache \
            libffi-dev libssl-dev \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libltdl-dev

      - name: Extract Android project
        run: |
          mkdir -p /tmp/farx-android
          unzip -q FARX-Android-Starter.zip -d /tmp/farx-android
          test -f /tmp/farx-android/android_app/main.py
          test -f /tmp/farx-android/android_app/buildozer.spec

      - name: Add FARX interpreter
        run: |
          git clone --depth 1 https://github.com/farhan6698/Farx-.git /tmp/farx-source
          cp -R /tmp/farx-source/farx /tmp/farx-android/android_app/farx
          if [ -d /tmp/farx-source/data ]; then
            cp -R /tmp/farx-source/data /tmp/farx-android/android_app/data
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Build Android APK
        working-directory: /tmp/farx-android/android_app
        env:
          BUILDOZER_WARN_ON_ROOT: '1'
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FARX-Android-APK
          path: /tmp/farx-android/android_app/bin/*.apk
          if-no-files-found: error
